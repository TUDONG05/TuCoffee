debug: false
logging:
  level:
    org.springframework.web: INFO

spring:
  application:
    name: tu-coffee-api
  jackson:
    mapper:
      allow-coercion-of-scalars: false
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:tu_coffee}?connectionTimeZone=UTC&connectTimeout=3000&socketTimeout=5000
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    hikari:
      connection-timeout: 3000
      validation-timeout: 1000
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mvc:
    log-request-details: false
    problemdetails:
      enabled: true

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      base-path: /api/v1
      discovery:
        enabled: false
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: false

auth:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  jwt-secret: ${AUTH_JWT_SECRET}
  allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:8080,http://127.0.0.1:8080}
  cookie-secure: ${AUTH_COOKIE_SECURE:true}

turnstile:
  enabled: ${TURNSTILE_ENABLED:false}
  site-key: ${TURNSTILE_SITE_KEY:}
  secret-key: ${TURNSTILE_SECRET_KEY:}
  hostnames: ${TURNSTILE_HOSTNAMES:localhost,127.0.0.1}

catalog:
  upload-dir: ${CATALOG_UPLOAD_DIR:uploads/catalog}
  seed:
    enabled: ${CATALOG_SEED_ENABLED:false}

payment:
  bank:
    code: ${BANK_CODE:VCB}
    account: ${BANK_ACCOUNT:0123456789}
    account-name: ${BANK_ACCOUNT_NAME:TU COFFEE}
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:DEMOV210}
    hash-secret: ${VNPAY_HASH_SECRET:DEMOHASHSECRET210}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:http://localhost:4200/orders/vnpay-return}
