server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 11m;

    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api api:8080;
        proxy_pass http://$api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
