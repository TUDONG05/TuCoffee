name: Kiểm tra nền tảng TuCoffee

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: tu_coffee
      MYSQL_USER: coffee
      TEST_MYSQL_HOST: 127.0.0.1
      TEST_MYSQL_PORT: 3306
      TEST_MYSQL_USER: coffee
      SERVER_ADDRESS: 127.0.0.1
      SERVER_PORT: 8081
      SPRING_PROFILES_ACTIVE: local
      AUTH_ALLOWED_ORIGINS: http://localhost:4201
      E2E_API_TARGET: http://127.0.0.1:8081
      E2E_ADMIN_EMAIL: admin-ci@example.test
      CI: "true"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.18.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Tạo khóa và mật khẩu tạm cho lần chạy CI
        shell: bash
        run: |
          jwt_secret=$(openssl rand -base64 48 | tr -d '\n')
          admin_password=$(openssl rand -base64 24 | tr -d '\n')
          mysql_password=$(openssl rand -base64 24 | tr -d '\n')
          echo "::add-mask::$jwt_secret"
          echo "::add-mask::$admin_password"
          echo "::add-mask::$mysql_password"
          echo "AUTH_JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"
          echo "BOOTSTRAP_ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"
          echo "MYSQL_PASSWORD=$mysql_password" >> "$GITHUB_ENV"
          echo "TEST_MYSQL_PASSWORD=$mysql_password" >> "$GITHUB_ENV"
      - name: Cài MySQL native trên runner
        shell: bash
        run: |
          # Ubuntu runner already includes MySQL; start it without reinstalling packages.
          sudo systemctl start mysql
          MYSQL_PWD=root mysql --host=127.0.0.1 --user=root --execute="CREATE DATABASE tu_coffee CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci; CREATE USER 'coffee'@'127.0.0.1' IDENTIFIED BY '$MYSQL_PASSWORD'; GRANT ALL PRIVILEGES ON *.* TO 'coffee'@'127.0.0.1';"
      - name: Kiểm tra và đóng gói backend với MySQL
        working-directory: backend
        run: sh ./mvnw -B verify
      - name: Cài dependency frontend theo lockfile
        working-directory: frontend
        run: npm ci
      - name: Kiểm tra frontend
        working-directory: frontend
        run: npm test -- --watch=false
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Tạo ADMIN trên database CI tạm
        run: >-
          java -jar backend/target/tu-coffee-api-0.0.1-SNAPSHOT.jar
          --spring.profiles.active=bootstrap --spring.main.web-application-type=none
          --bootstrap.admin.name="CI Administrator" --bootstrap.admin.email="$E2E_ADMIN_EMAIL"
          --debug=false
      - name: Khởi động backend cho smoke test
        run: java -jar backend/target/tu-coffee-api-0.0.1-SNAPSHOT.jar --debug=false --catalog.seed.enabled=true > /tmp/tu-coffee-api.log 2>&1 &
      - name: Chờ health check
        run: curl --fail --retry 30 --retry-all-errors --retry-delay 2 --max-time 5 http://127.0.0.1:8081/api/v1/health
      - name: Cài Chromium cho smoke test
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Kiểm tra Angular gọi backend thật
        working-directory: frontend
        run: npm run e2e
      - name: Log backend khi có lỗi
        if: failure()
        run: test ! -f /tmp/tu-coffee-api.log || cat /tmp/tu-coffee-api.log

  deploy:
    name: Triển khai develop lên TuCoffee
    needs: foundation
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: tucoffee-develop
    concurrency:
      group: tucoffee-develop
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Kiểm tra commit còn là đầu nhánh develop
        id: revision
        run: |
          set -euo pipefail
          current=$(git ls-remote --exit-code origin refs/heads/develop | cut -f1)
          if [[ "$current" == "$GITHUB_SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Gửi bản build lên máy chủ và kiểm tra HTTPS
        if: steps.revision.outputs.deploy == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${DEPLOY_SSH_KEY:?Missing DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing DEPLOY_KNOWN_HOSTS}"
          umask 077
          ssh_files=$(mktemp -d)
          trap 'rm -f "$ssh_files/key" "$ssh_files/known_hosts"; rmdir "$ssh_files"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$ssh_files/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_files/known_hosts"
          git archive "$GITHUB_SHA" | ssh -T -i "$ssh_files/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_files/known_hosts" -o ConnectTimeout=15 \
            tudong@tucoffee.tudv.tech
