services:
  db:
    image: mysql:8.0.46
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tu_coffee
      MYSQL_USER: coffee
      MYSQL_PASSWORD: ${TUCOFFEE_DB_PASSWORD:?Set TUCOFFEE_DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=tcp -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      start_period: 45s
      retries: 12
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_CONNECT_TIMEOUT_MS: "10000"
      MYSQL_SOCKET_TIMEOUT_MS: "15000"
      MYSQL_POOL_TIMEOUT_MS: "15000"
      MYSQL_MIGRATION_CONNECT_RETRIES: "4"
      MYSQL_USER: coffee
      MYSQL_PASSWORD: ${TUCOFFEE_DB_PASSWORD:?Set TUCOFFEE_DB_PASSWORD}
      SERVER_ADDRESS: 0.0.0.0
      AUTH_JWT_SECRET: ${TUCOFFEE_JWT_SECRET:?Set TUCOFFEE_JWT_SECRET}
      AUTH_ALLOWED_ORIGINS: https://tucoffee.tudv.tech
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-false}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_HOSTNAMES: tucoffee.tudv.tech
      BANK_CODE: "${BANK_CODE:-}"
      BANK_ACCOUNT: "${BANK_ACCOUNT:-}"
      BANK_ACCOUNT_NAME: "${BANK_ACCOUNT_NAME:-}"
      SEPAY_API_KEY: "${SEPAY_API_KEY:-}"
      VNPAY_TMN_CODE: "${VNPAY_TMN_CODE:-}"
      VNPAY_HASH_SECRET: "${VNPAY_HASH_SECRET:-}"
      VNPAY_PAY_URL: "${VNPAY_PAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}"
      VNPAY_RETURN_URL: "${VNPAY_RETURN_URL:-https://tucoffee.tudv.tech/orders/vnpay-return}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      SMTP_AUTH: "${SMTP_AUTH:-true}"
      SMTP_STARTTLS: "${SMTP_STARTTLS:-true}"
      RAG_WORKER_ENABLED: "${RAG_WORKER_ENABLED:-false}"
      RAG_EMBEDDING_URL: "${RAG_EMBEDDING_URL:-}"
      RAG_EMBEDDING_API_KEY: "${RAG_EMBEDDING_API_KEY:-}"
      RAG_EMBEDDING_MODEL: "${RAG_EMBEDDING_MODEL:-}"
      RAG_EMBEDDING_DIMENSIONS: "${RAG_EMBEDDING_DIMENSIONS:-0}"
      RAG_EMBEDDING_TIMEOUT_SECONDS: "${RAG_EMBEDDING_TIMEOUT_SECONDS:-15}"
      RAG_POLL_DELAY_MS: "${RAG_POLL_DELAY_MS:-3000}"
      RAG_CHAT_ENABLED: "${RAG_CHAT_ENABLED:-false}"
      RAG_CHAT_URL: "${RAG_CHAT_URL:-https://generativelanguage.googleapis.com/v1beta/openai/chat/completions}"
      RAG_CHAT_API_KEY: "${RAG_CHAT_API_KEY:-}"
      RAG_CHAT_MODEL: "${RAG_CHAT_MODEL:-gemini-3.1-flash-lite}"
      RAG_CHAT_TIMEOUT_SECONDS: "${RAG_CHAT_TIMEOUT_SECONDS:-20}"
      RAG_CHAT_DAILY_LIMIT: "${RAG_CHAT_DAILY_LIMIT:-500}"
      RAG_CHAT_MAX_CONCURRENT: "${RAG_CHAT_MAX_CONCURRENT:-20}"
      RAG_CHAT_MAX_CONCURRENT_PER_IDENTITY: "${RAG_CHAT_MAX_CONCURRENT_PER_IDENTITY:-2}"
      RAG_CHAT_MIN_SIMILARITY: "${RAG_CHAT_MIN_SIMILARITY:-0.55}"
      RAG_CHAT_REQUESTS_PER_IP_MINUTE: "${RAG_CHAT_REQUESTS_PER_IP_MINUTE:-10}"
      RAG_CHAT_REQUESTS_PER_USER_MINUTE: "${RAG_CHAT_REQUESTS_PER_USER_MINUTE:-10}"
      RAG_CHAT_TRUSTED_PROXY_IP: "${RAG_CHAT_TRUSTED_PROXY_IP:-}"
      PASSWORD_RESET_SECRET: "${PASSWORD_RESET_SECRET:-${TUCOFFEE_JWT_SECRET}}"
      CATALOG_UPLOAD_DIR: /data/catalog
      RAG_STORAGE_ROOT: /data/knowledge
    volumes:
      - app-data:/data
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:8182:80"
volumes:
  mysql:
  app-data:
