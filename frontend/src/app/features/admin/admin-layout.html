<div class="admin-shell">
  <aside class="admin-sidebar" aria-label="Khu vực quản trị">
    <a class="admin-brand" routerLink="/admin">
      <img src="/logo.png" alt="Tu’s Coffee" width="48" height="48" />
      <span>Tu’s Coffee<small>TRANG QUẢN TRỊ</small></span>
    </a>
    <ng-container [ngTemplateOutlet]="navigation" />
  </aside>

  <div class="admin-workspace">
    <header class="admin-topbar">
      <div class="workspace-heading">
        <button nz-button class="menu-toggle" type="button" aria-label="Mở menu quản trị"
          aria-controls="admin-mobile-menu" [attr.aria-expanded]="menuOpen()" (click)="openMenu()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
        </button>
      </div>
      <div class="admin-account">
        <button nz-button nzType="text" nz-dropdown [nzDropdownMenu]="accountMenu" nzTrigger="click"
          nzPlacement="bottomRight" class="admin-identity" type="button"
          aria-label="Mở menu tài khoản quản trị" aria-haspopup="menu"
          [attr.aria-expanded]="accountMenuOpen()" [disabled]="loggingOut()"
          (nzVisibleChange)="accountMenuOpen.set($event)">
          <span class="avatar" aria-hidden="true">{{ auth.user()?.name?.charAt(0)?.toUpperCase() }}</span>
          <span class="identity-copy"><strong>{{ auth.user()?.name }}</strong><small>Quản trị viên</small></span>
          <svg class="account-caret" width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="m3 4.5 3 3 3-3" stroke="currentColor" stroke-width="1.5" /></svg>
        </button>
        <nz-dropdown-menu #accountMenu="nzDropdownMenu">
          <ul nz-menu class="account-dropdown" aria-label="Tài khoản quản trị">
            <li nz-menu-item><a routerLink="/profile">Tài khoản</a></li>
            <li nz-menu-item><a routerLink="/menu">Xem cửa hàng</a></li>
            <li nz-menu-divider></li>
            <li nz-menu-item [nzDisabled]="loggingOut()">
              <button nz-button nzType="text" type="button" class="account-menu-logout"
                [disabled]="loggingOut()" (click)="logout()">{{ loggingOut() ? 'Đang đăng xuất…' : 'Đăng xuất' }}</button>
            </li>
          </ul>
        </nz-dropdown-menu>
      </div>
    </header>
    <section class="admin-content" aria-label="Nội dung quản trị"><router-outlet /></section>
  </div>
</div>

<dialog #mobileMenu id="admin-mobile-menu" class="mobile-menu" aria-label="Menu quản trị"
  (close)="menuOpen.set(false)" (click)="closeBackdrop($event)">
  <div class="mobile-menu-heading">
    <span class="mobile-menu-title">Tu’s Coffee <small>Quản trị cửa hàng</small></span>
    <button nz-button type="button" aria-label="Đóng menu quản trị" (click)="closeMenu()">×</button>
  </div>
  <ng-container [ngTemplateOutlet]="navigation" />
</dialog>

<ng-template #navigation>
  <nav class="admin-navigation" aria-label="Chức năng quản trị">
    <p class="nav-label">QUẢN LÝ CỬA HÀNG</p>
    @for (link of links; track link.path) {
      <a [routerLink]="link.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page" (click)="closeMenu()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path [attr.d]="link.icon" /></svg>
        {{ link.label }}
      </a>
    }
  </nav>
  <div class="sidebar-footer">
    <a routerLink="/menu" (click)="closeMenu()"><span aria-hidden="true">←</span> Xem cửa hàng</a>
    <p>Tu’s Coffee · Quản trị</p>
  </div>
</ng-template>
