components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: tucoffee_refresh
  schemas:
    Health:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - UP
          - DOWN
    Csrf:
      type: object
      additionalProperties: false
      required:
      - headerName
      - token
      properties:
        headerName:
          type: string
          enum:
          - X-XSRF-TOKEN
        token:
          type: string
    User:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - email
      - phone
      - address
      - role
      - active
      - passwordLoginAvailable
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
          maxLength: 150
          description: Trim/chữ thường
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        role:
          type: string
          enum:
          - USER
          - ADMIN
        active:
          type: boolean
        passwordLoginAvailable:
          type: boolean
          description: false cho tài khoản chỉ đăng nhập Google; không có đổi mật khẩu local.
    AuthResponse:
      type: object
      additionalProperties: false
      required:
      - accessToken
      - expiresIn
      - user
      properties:
        accessToken:
          type: string
          description: JWT chứa sub, sid, iss, iat, exp. Không ghi vào web storage/URL.
        expiresIn:
          type: integer
          enum:
          - 900
        user:
          $ref: '#/components/schemas/User'
    UserPage:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      - size
      - totalItems
      - totalPages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page:
          type: integer
        size:
          type: integer
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - detail
      - instance
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Mã lỗi nghiệp vụ/bảo mật; lỗi cú pháp JSON do framework có thể không có trường này.
        fieldErrors:
          type: object
          additionalProperties:
            type: string
    Category:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        name: *id008
        slug: *id009
        active:
          type: boolean
        version: *id010
      required:
      - id
      - name
      - slug
      - active
      - version
    Product:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        name: *id011
        description: *id012
        priceVnd: *id013
        imageUrl:
          type: string
          nullable: true
        active:
          type: boolean
        version: *id010
        category:
          $ref: '#/components/schemas/Category'
      required:
      - id
      - name
      - description
      - priceVnd
      - imageUrl
      - active
      - version
      - category
    ProductPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        page:
          type: integer
        size:
          type: integer
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
      required:
      - items
      - page
      - size
      - totalItems
      - totalPages
