openapi: 3.0.3
info:
  title: TuCoffee — API giai đoạn 2
  version: 0.3.0
  description: JWT HS256 15 phút lưu trong bộ nhớ frontend; refresh opaque cookie, thời hạn tuyệt đối 7 ngày, rotate mỗi lần.
    Replay thu hồi cả phiên. CSRF cho mọi thao tác ghi; Origin phải thuộc allowlist khi có. Cookie Secure mặc định, local
    HTTP phải bật profile local. Không có tích điểm/khuyến mãi.
servers:
- url: http://localhost:8080
paths:
  /api/v1/auth/turnstile/config:
    get:
      operationId: getTurnstileConfig
      summary: Cấu hình Turnstile công khai; no-store; không trả Secret Key
      responses:
        '200':
          description: Cấu hình xác minh cho email login/register
          content:
            application/json:
              schema:
                type: object
                required:
                - enabled
                - siteKey
                properties:
                  enabled:
                    type: boolean
                  siteKey:
                    type: string
                    nullable: true
  /api/v1/auth/google/config:
    get:
      operationId: getGoogleLoginConfig
      summary: Cấu hình Google và nonce 5 phút gắn với cookie trình duyệt; không cache
      responses:
        '200':
          description: enabled=false khi thiếu GOOGLE_CLIENT_ID; enabled=true cấp cookie HttpOnly tucoffee_google_nonce, SameSite=Strict,
            path /api/v1/auth/google. Secure mặc định.
          content:
            application/json:
              schema:
                type: object
                required:
                - enabled
                - clientId
                - nonce
                properties:
                  enabled:
                    type: boolean
                  clientId:
                    type: string
                    nullable: true
                  nonce:
                    type: string
                    nullable: true
  /api/v1/auth/google:
    post:
      operationId: googleLogin
      summary: Đăng nhập Google hoặc xác nhận liên kết bằng mật khẩu TuCoffee
      description: ID token phải có chữ ký Google, issuer/audience hợp lệ, email_verified=true, chưa hết hạn và nonce khớp
        cookie. Google sub là định danh; không tự gộp email. Tài khoản mới là USER, không có mật khẩu local. Email trùng cần
        currentPassword; giữ nguyên quyền của tài khoản hiện có.
      parameters:
      - name: X-XSRF-TOKEN
        in: header
        required: true
        schema:
          type: string
        description: Lấy từ GET /api/v1/auth/csrf; cần cookie XSRF-TOKEN tương ứng.
      - name: tucoffee_google_nonce
        in: cookie
        required: true
        schema:
          type: string
        description: Cookie HttpOnly do GET /google/config cấp; trình duyệt tự gửi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - credential
              properties:
                credential:
                  type: string
                  maxLength: 16384
                  description: ID token từ Google Identity Services; không lưu/log.
                currentPassword:
                  type: string
                  format: password
                  description: Chỉ gửi khi xác nhận liên kết email đã tồn tại; tối đa 72 byte UTF-8.
      responses:
        '200':
          description: AuthResponse, refresh cookie như login hiện tại; rotate CSRF và xóa nonce cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Dữ liệu/JSON không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: GOOGLE_TOKEN_INVALID, GOOGLE_NONCE_INVALID, INVALID_CREDENTIALS hoặc ACCOUNT_DISABLED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: CSRF_INVALID hoặc ORIGIN_FORBIDDEN
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 'GOOGLE_LINK_REQUIRED: nhập currentPassword và gửi lại với cùng credential trong thời hạn nonce. GOOGLE_IDENTITY_CONFLICT:
            không thể thay Google đã liên kết.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: RATE_LIMITED; giới hạn xác nhận mật khẩu như login hiện tại
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: GOOGLE_NOT_CONFIGURED khi GOOGLE_CLIENT_ID trống
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Trạng thái tổng quát backend và database
      responses:
        '200':
          description: UP; không có chi tiết kết nối
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: DOWN khi database không sẵn sàng sau khởi động
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/auth/csrf:
    get:
      operationId: getCsrf
      summary: Lấy CSRF cookie/token; không cache
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
  /api/v1/auth/register:
    post:
      operationId: register
      summary: Đăng ký USER; không tự đăng nhập
      parameters:
      - name: X-Turnstile-Token
        in: header
        required: false
        description: Bắt buộc khi GET /auth/turnstile/config trả enabled=true. Token dùng một lần, action tương ứng login/register;
          thiếu/sai trả 400 TURNSTILE_REQUIRED/INVALID. Provider lỗi trả 503 TURNSTILE_UNAVAILABLE.
        schema:
          type: string
          maxLength: 2048
      - name: X-XSRF-TOKEN
        in: header
        required: true
        description: Lấy từ GET /auth/csrf; cần cookie XSRF-TOKEN tương ứng.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - name
              - email
              - password
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                email:
                  type: string
                  format: email
                  maxLength: 150
                  description: Trim/chữ thường
                password:
                  type: string
                  format: password
                  minLength: 10
                  description: Không trim; tối đa 72 byte UTF-8.
      responses:
        '503':
          description: TURNSTILE_UNAVAILABLE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '201':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Validation/JSON/trường ngoài allowlist không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Xác thực/phiên không hợp lệ; xem code
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: FORBIDDEN, CSRF_INVALID hoặc ORIGIN_FORBIDDEN
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: EMAIL_EXISTS
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Đăng nhập và cấp refresh cookie
      parameters:
      - name: X-Turnstile-Token
        in: header
        required: false
        description: Bắt buộc khi GET /auth/turnstile/config trả enabled=true. Token dùng một lần, action tương ứng login/register;
          thiếu/sai trả 400 TURNSTILE_REQUIRED/INVALID. Provider lỗi trả 503 TURNSTILE_UNAVAILABLE.
        schema:
          type: string
          maxLength: 2048
      - name: X-XSRF-TOKEN
        in: header
        required: true
        description: Lấy từ GET /auth/csrf; cần cookie XSRF-TOKEN tương ứng.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 150
                  description: Trim/chữ thường
                password:
                  type: string
                  format: password
      responses:
        '503':
          description: TURNSTILE_UNAVAILABLE
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '200':
          description: 'Access mới; Cache-Control: no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          headers:
            Set-Cookie:
              description: tucoffee_refresh; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth. Secure=false chỉ profile
                local.
              schema:
                type: string
        '400':
          description: Validation/JSON/trường ngoài allowlist không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Xác thực/phiên không hợp lệ; xem code
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: FORBIDDEN, CSRF_INVALID hoặc ORIGIN_FORBIDDEN
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: RATE_LIMITED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      description: Sai email/mật khẩu hoặc tài khoản khóa cùng trả INVALID_CREDENTIALS. Giới hạn 5 lần sai/15 phút theo email
        và IP.
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      summary: Rotate refresh, không kéo dài hạn tuyệt đối
      parameters:
      - name: X-XSRF-TOKEN
        in: header
        required: true
        description: Lấy từ GET /auth/csrf; cần cookie XSRF-TOKEN tương ứng.
        schema:
          type: string
      responses:
        '200':
          description: 'Access mới; Cache-Control: no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          headers:
            Set-Cookie:
              description: tucoffee_refresh; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth. Secure=false chỉ profile
                local.
              schema:
                type: string
        '400':
          description: Validation/JSON/trường ngoài allowlist không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Xác thực/phiên không hợp lệ; xem code
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: FORBIDDEN, CSRF_INVALID hoặc ORIGIN_FORBIDDEN
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - refreshCookie: []
      description: Body rỗng. Single flight trong tab, Web Locks giữa tab. Không tự retry nếu mất phản hồi mơ hồ; đăng nhập
        lại.
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Thu hồi phiên và xóa cookie
      parameters:
      - name: X-XSRF-TOKEN
        in: header
        required: true
        description: Lấy từ GET /auth/csrf; cần cookie XSRF-TOKEN tương ứng.
        schema:
          type: string
      responses:
        '204':
          description: Đã thu hồi phiên, xóa refresh và CSRF cookie
        '403':
          description: FORBIDDEN, CSRF_INVALID hoặc ORIGIN_FORBIDDEN
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      description: Idempotent. Cookie hoặc bearer kể cả access hết hạn. CSRF vẫn bắt buộc. Các phiên khác giữ nguyên.
  /api/v1/users/me:
    get:
      operationId: getProfile
      summary: Hồ sơ hiện tại
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Xác thực/phiên không hợp lệ; xem code
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    patch:
      operationId: updateProfile
      summary: Cập nhật đủ name, phone, address
      parameters:
      - name: X-XSRF-TOKEN
        in: header
        required: true
        description: Lấy từ GET /auth/csrf; cần cookie XSRF-TOKEN tương ứng.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - name
              - phone
              - address
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 100
                phone:
                  type: string
                  nullable: true
                  pattern: ^0[35789]\d{8}$
                address:
                  type: string
                  nullable: true
                  maxLength: 300
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Validation/JSON/trường ngoài allowlist không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Xác thực/phiên không hợp lệ; xem code
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: FORBIDDEN, CSRF_INVALID hoặc ORIGIN_FORBIDDEN
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: []
      description: Gửi đủ ba trường; phone/address có thể null. Không sửa email/role/active.
  /api/v1/users/me/password:
    put:
      operationId: changePassword
      summary: Đổi mật khẩu, thay mọi phiên cũ bằng một phiên mới
      parameters:
      - name: X-XSRF-TOKEN
        in: header
        required: true
        description: Lấy từ GET /auth/csrf; cần cookie XSRF-TOKEN tương ứng.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - currentPassword
              - newPassword
              properties:
                currentPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
                  minLength: 10
                  description: Không trim; tối đa 72 byte UTF-8.
      responses:
        '200':
          description: 'Access mới; Cache-Control: no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          headers:
            Set-Cookie:
              description: tucoffee_refresh; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth. Secure=false chỉ profile
                local.
              schema:
                type: string
        '400':
          description: Validation/JSON/trường ngoài allowlist không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Xác thực/phiên không hợp lệ; xem code
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: FORBIDDEN, CSRF_INVALID hoặc ORIGIN_FORBIDDEN
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: []
      description: Mật khẩu cũ sai trả INVALID_CURRENT_PASSWORD 400. Revoke tất cả sid cũ, cấp access/cookie sid mới, giữ
        hạn tuyệt đối của phiên hiện tại. Lấy lại CSRF sau thành công.
  /api/v1/admin/users:
    get:
      operationId: listUsers
      summary: ADMIN tìm kiếm, lọc và phân trang tài khoản theo id
      security:
      - bearerAuth: []
      parameters:
      - name: q
        in: query
        schema:
          type: string
          maxLength: 100
          default: ''
      - name: active
        in: query
        schema:
          type: boolean
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 1000000
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 12
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          description: Validation/JSON/trường ngoài allowlist không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Xác thực/phiên không hợp lệ; xem code
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: FORBIDDEN, CSRF_INVALID hoặc ORIGIN_FORBIDDEN
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/admin/users/{id}/active:
    patch:
      operationId: setUserActive
      summary: ADMIN khóa/mở tài khoản
      parameters:
      - name: X-XSRF-TOKEN
        in: header
        required: true
        description: Lấy từ GET /auth/csrf; cần cookie XSRF-TOKEN tương ứng.
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - active
              properties:
                active:
                  type: boolean
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Validation/JSON/trường ngoài allowlist không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Xác thực/phiên không hợp lệ; xem code
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: FORBIDDEN, CSRF_INVALID hoặc ORIGIN_FORBIDDEN
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Không tìm thấy tài khoản
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: ADMIN_LOCK_NOT_ALLOWED
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - bearerAuth: []
      description: Khóa thu hồi mọi phiên; mở khóa không phục hồi phiên cũ. Cấm tự khóa hoặc khóa ADMIN hoạt động cuối, kể
        cả đồng thời.
  /api/v1/categories:
    get:
      summary: Danh mục đang hoạt động
      operationId: catalog1
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Không tìm thấy
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/products:
    get:
      summary: Thực đơn công khai
      operationId: catalog2
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Không tìm thấy
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - &id002
        name: q
        in: query
        schema:
          type: string
          maxLength: 100
      - &id003
        name: categoryId
        in: query
        schema: &id001
          type: integer
          format: int64
          minimum: 1
      - &id004
        name: page
        in: query
        schema:
          type: integer
          minimum: 0
          maximum: 1000000
          default: 0
      - &id005
        name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 12
      - &id006
        name: sort
        in: query
        schema:
          type: string
          enum:
          - id
          - name
          - priceAsc
          - priceDesc
          default: id
  /api/v1/products/{id}:
    get:
      summary: Chi tiết món đang bán
      operationId: catalog3
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Không tìm thấy
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - &id007
        name: id
        in: path
        required: true
        schema: *id001
  /api/v1/admin/categories:
    get:
      summary: ADMIN danh mục
      operationId: catalog4
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '400':
          description: Dữ liệu không hợp lệ
          content:
